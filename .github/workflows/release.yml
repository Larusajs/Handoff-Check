name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed package version on main
        required: true
        default: 0.2.0
      sha256:
        description: Reviewed tarball SHA256 (required when publish is true)
        required: false
      publish:
        description: Publish to npm using the configured trusted publisher
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e 'if (JSON.parse(require("node:fs").readFileSync("package.json")).version !== process.env.RELEASE_VERSION) process.exit(1)'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: npm pack --ignore-scripts
      - name: Verify artifact digest
        env:
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: |
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),p=require("./package.json"),actual=crypto.createHash("sha256").update(fs.readFileSync(`${p.name}-${p.version}.tgz`)).digest("hex"),expected=process.env.EXPECTED_SHA256;console.log(`Artifact SHA256: ${actual}`);if(process.env.RELEASE_PUBLISH==="true"&&!/^[a-f0-9]{64}$/.test(expected||""))throw new Error("Publishing requires the reviewed artifact SHA256");if(expected&&expected!==actual)throw new Error("Artifact differs from reviewed SHA256")'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: handoff-check-*.tgz
      - name: Publish reviewed package
        if: inputs.publish
        run: |
          node -e 'const v=require("node:child_process").execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number);if(v[0]<11||(v[0]===11&&(v[1]<5||(v[1]===5&&v[2]<1))))throw new Error("npm 11.5.1+ required for trusted publishing")'
          npm publish handoff-check-*.tgz --ignore-scripts --access public
