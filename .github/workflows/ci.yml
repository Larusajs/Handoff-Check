name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify built Node.js CLI
        run: node dist/cli.js verify --constraints examples/stale-handoff/constraints.json --handoff examples/stale-handoff/corrected-handoff.json --scope staging --as-of 2026-11-23T09:00:00Z --format json
      - name: Verify packed end-user onboarding
        shell: bash
        run: |
          npm pack --ignore-scripts
          PACKAGE="$(pwd)/handoff-check-$(node -p 'require("./package.json").version').tgz"
          CONSUMER="$(mktemp -d)"
          cd "$CONSUMER"
          npx --yes --offline --package="$PACKAGE" handoff-check init --scope staging --agent both --ci
          npx --yes --offline --package="$PACKAGE" handoff-check verify --format json --require-content
          npx --yes --offline --package="$PACKAGE" handoff-check verify > empty-summary.txt
          node -e 'const s=require("node:fs").readFileSync("empty-summary.txt","utf8");if(!s.includes("PASS (EMPTY)")||!s.includes("0 active constraints checked"))process.exit(1)'
          if npx --yes --offline --package="$PACKAGE" handoff-check verify --require-active --format json > empty-policy.json; then
            echo "Expected require-active to reject the empty starter"
            exit 1
          else
            VERIFY_EXIT=$?
            test "$VERIFY_EXIT" -eq 1
          fi
          node -e 'const r=require("./empty-policy.json");if(r.activeConstraintCount!==0||r.findings[0].code!=="NO_ACTIVE_CONSTRAINTS"||Object.hasOwn(r.findings[0],"id"))process.exit(1)'
          node -e 'require("node:fs").writeFileSync("constraints.json",JSON.stringify({schemaVersion:2,constraints:[{id:"C-01",revision:1,scope:"staging",description:"Review migrations",source:"synthetic:ci"}]}))'
          npx --yes --offline --package="$PACKAGE" handoff-check snapshot --task "Resume migrations" --output handoff.next.json
          npx --yes --offline --package="$PACKAGE" handoff-check verify --handoff handoff.next.json --require-content --require-active --format json > active-result.json
          node -e 'const r=require("./active-result.json");if(r.status!=="verified"||r.activeConstraintCount!==1)process.exit(1)'
          node -e 'const fs=require("node:fs"),p=JSON.parse(fs.readFileSync("constraints.json"));p.constraints[0].description="Require two reviewers";fs.writeFileSync("constraints.json",JSON.stringify(p))'
          if npx --yes --offline --package="$PACKAGE" handoff-check verify --handoff handoff.next.json --require-content --format json > changed.json; then
            echo "Expected same-ID content change to fail"
            exit 1
          else
            VERIFY_EXIT=$?
            test "$VERIFY_EXIT" -eq 1
          fi
          node -e 'const r=require("./changed.json");if(r.findings.length!==1||r.findings[0].code!=="CHANGED")process.exit(1)'
