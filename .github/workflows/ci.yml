name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify built Node.js CLI
        run: node dist/cli.js verify --constraints examples/stale-handoff/constraints.json --handoff examples/stale-handoff/corrected-handoff.json --scope staging --as-of 2026-11-23T09:00:00Z --format json
      - name: Verify packed end-user onboarding
        shell: bash
        run: |
          npm pack --ignore-scripts
          PACKAGE="$(pwd)/handoff-check-$(node -p 'require("./package.json").version').tgz"
          CONSUMER="$(mktemp -d)"
          cd "$CONSUMER"
          npx --yes --offline --package="$PACKAGE" handoff-check init --scope staging --agent both --ci
          npx --yes --offline --package="$PACKAGE" handoff-check verify --format json
