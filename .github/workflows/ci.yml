name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify built Node.js CLI
        run: node dist/cli.js verify --constraints examples/stale-handoff/constraints.json --handoff examples/stale-handoff/corrected-handoff.json --scope staging --as-of 2026-11-23T09:00:00Z --format json
      - name: Verify packed end-user onboarding
        shell: bash
        run: |
          npm pack --ignore-scripts
          PACKAGE="$(pwd)/handoff-check-$(node -p 'require("./package.json").version').tgz"
          CONSUMER="$(mktemp -d)"
          cd "$CONSUMER"
          npx --yes --offline --package="$PACKAGE" handoff-check init --scope staging --agent both --ci
          npx --yes --offline --package="$PACKAGE" handoff-check verify --format json --require-content
          npx --yes --offline --package="$PACKAGE" handoff-check verify > empty-summary.txt
          node -e 'const s=require("node:fs").readFileSync("empty-summary.txt","utf8");if(!s.includes("PASS (EMPTY)")||!s.includes("0 active constraints checked"))process.exit(1)'
          if npx --yes --offline --package="$PACKAGE" handoff-check verify --require-active --format json > empty-policy.json; then
            echo "Expected require-active to reject the empty starter"
            exit 1
          else
            VERIFY_EXIT=$?
            test "$VERIFY_EXIT" -eq 1
          fi
          node -e 'const r=require("./empty-policy.json");if(r.activeConstraintCount!==0||r.findings[0].code!=="NO_ACTIVE_CONSTRAINTS"||Object.hasOwn(r.findings[0],"id"))process.exit(1)'
          node -e 'require("node:fs").writeFileSync("constraints.json",JSON.stringify({schemaVersion:2,constraints:[{id:"C-01",revision:1,scope:"staging",description:"Review migrations",source:"synthetic:ci"}]}))'
          npx --yes --offline --package="$PACKAGE" handoff-check snapshot --task "Resume migrations" --output handoff.next.json
          npx --yes --offline --package="$PACKAGE" handoff-check verify --handoff handoff.next.json --require-content --require-active --format json > active-result.json
          node -e 'const r=require("./active-result.json");if(r.status!=="verified"||r.activeConstraintCount!==1)process.exit(1)'
          npx --yes --offline --package="$PACKAGE" handoff-check doctor --format json > doctor.json
          node -e 'const r=require("./doctor.json");if(r.status!=="healthy"||r.paths.constraints!==require("node:path").resolve("constraints.json"))process.exit(1)'
          npx --yes --offline --package="$PACKAGE" handoff-check hook-config --host claude > hook-config.json
          npm install --offline --ignore-scripts --no-audit --no-fund --save-dev "$PACKAGE"
          node -e 'const fs=require("node:fs"),cp=require("node:child_process"),h=require("./hook-config.json").hooks.SessionStart[0].hooks[0],args=h.args.map(a=>a.replace("${CLAUDE_PROJECT_DIR}",process.cwd())),output=JSON.parse(cp.execFileSync(h.command,args,{input:JSON.stringify({hook_event_name:"SessionStart",source:"resume",cwd:process.cwd(),transcript_path:"DO-NOT-OPEN"}),encoding:"utf8"}));if(!output.hookSpecificOutput.additionalContext.includes("MISSING C-01"))process.exit(1)'
          npx --yes --offline --package="$PACKAGE" handoff-check explain --format json > explanation.json
          node -e 'const r=require("./explanation.json");if(r.activeConstraintCount!==1||r.rules[0].decision!=="ACTIVE")process.exit(1)'
          npx --yes --offline --package="$PACKAGE" handoff-check snapshot --task "Review retained baseline" --include-content --output handoff.retained.json
          npx --yes --offline --package="$PACKAGE" handoff-check verify --handoff handoff.retained.json --require-content --format markdown > report.md
          node -e 'const fs=require("node:fs"),p=JSON.parse(fs.readFileSync("constraints.json"));p.constraints[0].description="Require two reviewers";fs.writeFileSync("constraints.json",JSON.stringify(p))'
          if npx --yes --offline --package="$PACKAGE" handoff-check verify --handoff handoff.next.json --require-content --format json > changed.json; then
            echo "Expected same-ID content change to fail"
            exit 1
          else
            VERIFY_EXIT=$?
            test "$VERIFY_EXIT" -eq 1
          fi
          node -e 'const r=require("./changed.json");if(r.findings.length!==1||r.findings[0].code!=="CHANGED")process.exit(1)'
          if npx --yes --offline --package="$PACKAGE" handoff-check verify --handoff handoff.retained.json --require-content --format json > retained-change.json; then
            echo "Expected retained baseline content change to fail"
            exit 1
          else
            VERIFY_EXIT=$?
            test "$VERIFY_EXIT" -eq 1
          fi
          node -e 'const r=require("./retained-change.json");if(r.schemaVersion!==3||r.findings[0].changes[0].field!=="description"||r.findings[0].changes[0].before!=="Review migrations"||r.findings[0].changes[0].after!=="Require two reviewers")process.exit(1)'
          npx --yes --offline --package="$PACKAGE" handoff-check snapshot --task "Review changed rules" --include-content --output handoff.after.json
          if npx --yes --offline --package="$PACKAGE" handoff-check diff --before handoff.retained.json --after handoff.after.json --format json > snapshot-diff.json; then
            echo "Expected snapshot differences"
            exit 1
          else
            DIFF_EXIT=$?
            test "$DIFF_EXIT" -eq 1
          fi
          node -e 'const r=require("./snapshot-diff.json");if(r.schemaVersion!==1||r.status!=="different"||r.changes[0].fields[0].field!=="description"||r.beforeCount!==1||r.afterCount!==1)process.exit(1)'
          npx --yes --offline --package="$PACKAGE" handoff-check diff --before handoff.after.json --after handoff.after.json --format markdown > unchanged-diff.md
          if npx --yes --offline --package="$PACKAGE" handoff-check setup > setup.out 2> setup.err; then
            echo "Expected noninteractive setup rejection"
            exit 1
          else
            SETUP_EXIT=$?
            test "$SETUP_EXIT" -eq 2
          fi
          node -e 'if(!require("node:fs").readFileSync("setup.err","utf8").includes("interactive terminal"))process.exit(1)'
          node -e 'const fs=require("node:fs");fs.writeFileSync("constraints.bound.json",JSON.stringify({schemaVersion:3,projectId:"ci-project",constraints:[{id:"B-01",revision:1,scope:"staging",description:"Review bound work",source:"synthetic:ci"}]}));fs.writeFileSync(".handoff-check.json",JSON.stringify({schemaVersion:2,projectId:"ci-project",profiles:{stage:{scope:"staging",constraints:"constraints.bound.json",handoff:"handoff.bound.json"}}}))'
          npx --yes --offline --package="$PACKAGE" handoff-check snapshot --profile stage --task "Review project baseline" --output handoff.bound.json
          npx --yes --offline --package="$PACKAGE" handoff-check verify --profile stage --require-content --report --format json > bound-report.json
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),r=require("./bound-report.json"),sha="sha256:"+crypto.createHash("sha256").update(fs.readFileSync("constraints.bound.json")).digest("hex");if(r.result.schemaVersion!==4||r.result.projectId!=="ci-project"||r.profile!=="stage"||r.inputs.manifest.sha256!==sha)process.exit(1)'
          npx --yes --offline --package="$PACKAGE" handoff-check hook-config --host claude --profile stage > hook-profile.json
          node -e 'const cp=require("node:child_process"),h=require("./hook-profile.json").hooks.SessionStart[0].hooks[0],args=h.args.map(a=>a.replace("${CLAUDE_PROJECT_DIR}",process.cwd())),r=JSON.parse(cp.execFileSync(h.command,args,{input:JSON.stringify({hook_event_name:"SessionStart",source:"resume",cwd:process.cwd()}),encoding:"utf8"}));if(!r.hookSpecificOutput.additionalContext.includes("Project ci-project. Profile stage."))process.exit(1)'
          node -e 'const fs=require("node:fs"),h=JSON.parse(fs.readFileSync("handoff.bound.json"));h.projectId="another-project";fs.writeFileSync("handoff.bound.json",JSON.stringify(h))'
          if npx --yes --offline --package="$PACKAGE" handoff-check verify --profile stage --format json > cross-project.json; then
            echo "Expected cross-project baseline rejection"
            exit 1
          else
            VERIFY_EXIT=$?
            test "$VERIFY_EXIT" -eq 2
          fi
